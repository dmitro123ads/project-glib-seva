<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Top Of Serials</title>
    <link rel="stylesheet" href="style.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Space+Grotesk:wght@300..700&display=swap"
        rel="stylesheet">
</head>

<body>
    <header>
        <h1 class="logo">Top Of <span class="logo_part">Serials</span></h1>
        <nav>
            <p class="nav_link"><a href="">Trends</a></p>
            <p class="nav_link"><a href="">Archives</a></p>
            <p class="nav_link"><a href="">Drops</a></p>
            <p class="nav_link"><a href="">Community</a></p>

        </nav>
        <button class="header_but">Join the Club</button>
    </header>
    <main>
        <section class="hero">
            <div>
                <p class="present">Top Of Serials presents</p>
                <h2>Breaking Bad</h2>
                <p>Your Style — Your Rules. Curating the sun-
                    drenched aesthetics of the millennium for the
                    modern concrete jungle.</p>
                <button>Explore Archive</button>
                <button data-modal-open>View Drops</button>
            </div>
            <img src="./img/breaking_bad_hero.webp" alt="breaking bad" class="hero_poster">
        </section>
    </main>
</body>

<div class="backdrop is-hidden" data-modal>
    <div class="modal">

        <div>
            <div class="film">
            <button data-modal-close class="x">✕</button>
                <img src="./img/breaking_bad.webp" alt="breaking bad" class="poster">
                <h2>Breaking Bad</h2>
                <p>One of the best serials of all time</p>
            </div>
            <div class="discount">
                <p>rating</p>
                <h2>9.5</h2>
                
            </div>
            <form action="">
            <input type="text" placeholder="share you`r opinion" class="modal_form">
            <button class="modal_but" type="reset">send</button>
        </form>
        </div>
    </div>
</div>
<script src="app.js"></script>

</html>
